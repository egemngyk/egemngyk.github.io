<!DOCTYPE html>
<html lang="tr" class="loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <title>Depo · GitHub</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/readme.css">
  <link rel="stylesheet" href="css/repos.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/repo-page.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- JS çalışmazsa veya geç kalırsa içerik yine de açılır -->
  <noscript><style>html.loading main { opacity: 1; }</style></noscript>
  <script>setTimeout(function () { document.documentElement.classList.remove("loading"); }, 10000);</script>
</head>

<body>
  <div class="loadbar" id="loadbar" role="progressbar" aria-label="Sayfa yükleniyor"></div>
  <div class="page-loader" aria-hidden="true"><span class="spinner"></span></div>

  <header>
    <a class="mark" href="https://github.com" aria-label="GitHub">⌘</a>
    <strong>GitHub</strong>
    <a class="account" href="https://github.com/egemngyk">egemngyk</a>
  </header>

  <main class="wide">
    <div class="rv-head" id="repo-head"></div>

    <div class="rv-layout">
      <section class="rv-main" id="rv-main" aria-live="polite"></section>
      <aside class="rv-side" id="rv-side"></aside>
    </div>

    <footer>
      <!-- Sabit imza: gösterilen profilden bağımsızdır -->
      <a href="https://github.com">GitHub</a> · Minimal profil · <a href="https://github.com/egemngyk" rel="noopener noreferrer">egemngyk</a>
    </footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script type="module" src="js/repo-page.js"></script>
</body>
</html>
